<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
    <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      padding: 50px 60px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      width: 500px;
      animation: fadeIn 0.8s ease-in-out;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    #txt-central {
      font-size: 18px;
      margin-bottom: 30px;
      color: #ccc;
    }

    #redireciona-btn {
      display: none;
      padding: 12px 30px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(90deg, #1aff00, #0fbf00);
      transition: 0.3s;
    }

    #redireciona-btn:hover {
      transform: scale(1.05);
    }

    /* Loader animado */
    .loader {
      margin: 0 auto 25px auto;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.2);
      border-top: 5px solid #1aff00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>
  <div class="container">
    <div class="loader"></div>

    <h1>Você está sendo redirecionado...</h1>
    <p id="txt-central">Aguarde alguns segundos...</p>

    <button id="redireciona-btn">Ir para o site</button>
  </div>

  <script src="configAWS.js"></script> 
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const urlCurta = params.get("url-curta");

      // Verificando se link do S3 foi definido
      if (typeof S3_SHORT_WEBSITE_URL === "undefined" || !S3_SHORT_WEBSITE_URL) { 
        document.getElementById("txt-central").innerText = "Erro interno: configuração ausente.";
        console.error("Configuração faltando: defina S3_SHORT_WEBSITE_URL em configAWS.js");
        return;
      }

      // Verificando se existe url
      if (!urlCurta) {
        document.getElementById("txt-central").innerText = "Link inválido.";
      } else {
        const linkRedireciona = S3_SHORT_WEBSITE_URL + "/" + urlCurta;
        const txtCentral = document.getElementById("txt-central");
        const botao = document.getElementById("redireciona-btn");

        let tempo = 5;

        txtCentral.innerText = `Redirecionando em ${tempo} segundos...`;

        const interval = setInterval(() => {
          tempo--;
          if (tempo > 0) {
            txtCentral.innerText = `Redirecionando em ${tempo} segundos...`;
          } else {
            clearInterval(interval);
            txtCentral.innerText = "Clique no botão abaixo para continuar:";
            botao.style.display = "inline-block";
            botao.onclick = () => window.location.href = linkRedireciona;
          }
        }, 1000);
      }
    })();
  </script>
</body>
</html>
